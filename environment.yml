# Note: name can be changed
name: "base"
channels:
  # important: do not use 'defaults', but always include 'nodefaults'
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10 # set your python version here
  - tensorflow
  - numba
  - scikit-learn
  - pandas
  - seaborn
  - matplotlib
  - jupyterlab
  - networkx
  - xarray
  - igraph
  - pip
  - pip:
      # put packages to be installed by pip here
# Note: prefix can be changed
prefix: "/opt/conda"